name: Feature request
description: Propose a focused improvement to TADL.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Explain the user problem first. Proposals must preserve TADL's authority boundary.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or maintainer problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and architecture impact
      description: Explain any effect on authority, trust boundaries, provenance, or compatibility.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that define completion.
    validations:
      required: true
