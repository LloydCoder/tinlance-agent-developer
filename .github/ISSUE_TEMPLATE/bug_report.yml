name: Bug report
description: Report a reproducible defect in TADL.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before filing a duplicate. Do not include secrets or private customer data.
  - type: input
    id: version
    attributes:
      label: TADL version or commit
      description: Provide the package version or commit SHA you tested.
      placeholder: 1.4.0 / 02126ed
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 22.x
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: Exact command that failed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal reproduction steps or fixture. Remove secrets.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
      description: Include relevant output with credentials and sensitive data removed.
