name: Ecosystem Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ecosystem-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: TADL + Agent OS + SDK + Platform + TWI + World Intelligence
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: world_intelligence_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d world_intelligence_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout TADL
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v6.0.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install TADL
        run: npm ci --ignore-scripts && npm run build

      - name: Materialize pinned ecosystem repositories
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          lock = json.loads(Path("ecosystem.lock.json").read_text())
          authority = lock["integration_authority"]
          targets = [(authority["repository"], authority["ref"], Path("/tmp/tinlance-tsic"))]
          for name, item in lock["repositories"].items():
              targets.append((item["repository"], item["ref"], Path("/tmp") / f"tinlance-{name}"))
          twi = lock["integrations"]["twi"]
          targets.append((twi["repository"], twi["ref"], Path("/tmp/tinlance-twi")))
          world_intelligence = lock["integrations"]["world_intelligence"]
          targets.append((world_intelligence["repository"], world_intelligence["ref"], Path("/tmp/tinlance-world-intelligence")))

          for repository, ref, target in targets:
              subprocess.run(
                  ["git", "clone", "--quiet", f"https://github.com/{repository}.git", str(target)],
                  check=True,
              )
              subprocess.run(["git", "-C", str(target), "checkout", "--quiet", ref], check=True)
              actual = subprocess.check_output(
                  ["git", "-C", str(target), "rev-parse", "HEAD"], text=True
              ).strip()
              if actual != ref:
                  raise SystemExit(f"pinned checkout mismatch for {repository}: {actual} != {ref}")
          PY

      - name: Run canonical TSIC authority gate
        run: python scripts/tsic_conformance.py

      - name: Install cross-repository integration components
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8.4" "jsonschema>=4.23,<5"
          python -m pip install /tmp/tinlance-platform /tmp/tinlance-platform_sdk /tmp/tinlance-os
          python -m pip install -e "/tmp/tinlance-platform/reference_agents[test]" --no-deps
          python -m pip install -e "/tmp/tinlance-twi[dev]"
          python -m pip install -e "/tmp/tinlance-world-intelligence[runtime]"

      - name: Create isolated TWI PostgreSQL persistence database
        env:
          PGPASSWORD: postgres
        run: createdb --host=127.0.0.1 --username=postgres twi_test

      - name: Run TWI package tests from the pinned revision
        working-directory: /tmp/tinlance-twi
        env:
          TWI_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/twi_test
        run: python -m pytest -q tests

      - name: Apply pinned World Intelligence database migrations
        working-directory: /tmp/tinlance-world-intelligence
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in db/migrations/*.sql; do
            psql "postgresql://postgres@127.0.0.1:5432/world_intelligence_test" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Run pinned World Intelligence source-evidence HTTP and PostgreSQL integration tests
        working-directory: /tmp/tinlance-world-intelligence
        env:
          WORLD_INTELLIGENCE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/world_intelligence_test
        run: python -m pytest -q tests/integration/test_twi_source_evidence.py tests/integration/test_twi_source_evidence_postgres.py

      - name: Run PostgreSQL tenant policy and query audit enforcement
        working-directory: /tmp/tinlance-world-intelligence
        env:
          WORLD_INTELLIGENCE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/world_intelligence_test
        run: python tests/integration/test_query_policy_postgres.py -v

      - name: Run World Intelligence TSIC conformance against the exact canonical pin
        env:
          TSIC_ROOT: /tmp/tinlance-tsic
        run: |
          set -euo pipefail
          export TSIC_REVISION="$(python -c 'import json; print(json.load(open("ecosystem.lock.json", encoding="utf-8"))["integration_authority"]["ref"])')"
          python /tmp/tinlance-world-intelligence/scripts/tsic_conformance.py

      - name: Run TWI client → PostgreSQL-backed World Intelligence HTTP end-to-end test
        env:
          WORLD_INTELLIGENCE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/world_intelligence_test
        run: python -m pytest -q tests/integration/test_twi_world_intelligence_e2e.py

      - name: Run TSIC TWI requirement-to-test mapping gate
        run: python scripts/twi_tsic_conformance.py

      - name: Run Platform-owned TWI and World Intelligence MCP/API adapter tests
        run: python -m pytest /tmp/tinlance-platform/tests/test_twi_mcp_integration.py /tmp/tinlance-platform/tests/test_twi_api_handler.py /tmp/tinlance-platform/tests/test_world_intelligence_mcp_integration.py

      - name: Run TSIC World Intelligence Platform query requirement-to-test mapping gate
        env:
          TSIC_ROOT: /tmp/tinlance-tsic
          PLATFORM_ROOT: /tmp/tinlance-platform
        run: python scripts/world_intelligence_platform_conformance.py

      - name: Run Platform → World Intelligence signed-JWT and PostgreSQL query end-to-end test
        env:
          WORLD_INTELLIGENCE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/world_intelligence_test
        run: python -m pytest -q tests/integration/test_platform_world_intelligence_query_e2e.py

      - name: Run end-to-end contract smoke test
        run: python scripts/ecosystem_smoke.py

      - name: Run ecosystem conformance suite
        run: python scripts/ecosystem_conformance.py

      - name: Run governed-execution adversarial regression (cross-cutting)
        run: python scripts/p2_adversarial_conformance.py

      - name: Run canonical P2 identity and tenancy conformance
        run: python scripts/p2_identity_tenancy_conformance.py

      - name: Run cross-cutting team delegation regression
        run: python scripts/p5_team_delegation_conformance.py

      - name: Run ecosystem component regression gate
        run: python scripts/ecosystem_phase_conformance.py

      - name: Run canonical P3 event delivery conformance
        run: python scripts/p3_event_delivery_conformance.py

      - name: Run canonical P4 trace lineage and evidence integrity conformance
        run: python scripts/p4_trace_lineage_conformance.py

      - name: Run canonical P5 registry and compatibility conformance
        run: python scripts/p5_registry_conformance.py

      - name: Run canonical P6 model routing authority conformance
        run: python scripts/p6_routing_conformance.py

      - name: Run canonical P7 real adapter and integration boundary conformance
        run: python scripts/p7_adapter_conformance.py

      - name: Run canonical P8 budget, quota and recovery conformance
        run: python scripts/p8_budget_quota_conformance.py

      - name: Run canonical P9 MCP/A2A interoperability and security conformance
        run: python scripts/p9_interoperability_conformance.py

      - name: Run canonical P10 end-to-end recovery certification
        run: python scripts/p10_recovery_conformance.py
